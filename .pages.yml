media:
  input: public
  output: /

content:
  - name: inicio
    label: Inicio
    type: file
    path: src/content/inicio.md
    format: yaml-frontmatter
    fields:
      - name: linea1
        label: Línea 1
        type: string
      - name: linea2
        label: Línea 2
        type: string
      - name: fondo
        label: Imagen de inicio
        type: image # Proporciona previsualización [3, 4]
        description: "Imagen principal de la cabecera"
      - name: video
        label: Video de fondo
        type: file # Para archivos mp4, webm, etc. [5]
        description: "Archivo de video para el fondo"
      - name: body
        label: Contenido principal
        type: rich-text # Mapea directamente al cuerpo del Markdown [6]
        description: "Texto que aparecerá debajo de las líneas principales"

  - name: nosotros
    label: Nosotros
    type: file
    path: src/content/about.md
    format: yaml-frontmatter
    fields:
      - name: bullets
        label: Puntos clave (Bullets)
        type: object
        list:
          max: 4
          collapsible:
            summary: "{title}" # Muestra el título al estar contraído [2]
        fields:
          - name: title
            label: Título
            type: string
            required: true
          - name: text
            label: Texto
            type: text # Permite múltiples líneas [6]
            required: true
          - name: image
            label: Imagen
            type: image
            description: "Imagen al lado derecho del slide"
      - name: texto1
        label: Primer bloque de texto
        type: text
      - name: texto2
        label: Segundo bloque de texto
        type: text

  - name: servicios
    label: Servicios
    type: file
    path: src/content/servicios.md
    format: yaml-frontmatter
    fields:
      - name: encabezado
        label: Encabezado de la página
        type: string
      - name: imagen
        label: Imagen de servicios
        type: image
        description: "Foto junto a la lista de servicios"
      - name: servicios_lista
        label: Lista de servicios
        type: object
        list:
          max: 4
          collapsible:
            summary: "{titulo}"
        fields:
          - name: titulo
            label: Título
            type: string
            required: true
          - name: descripcion
            label: Descripción
            type: text

  - name: contacto
    label: Contacto
    type: file
    path: src/content/contacto.md # Corregido: Ahora es un archivo independiente [7]
    format: yaml-frontmatter
    fields:
      - name: titulo
        label: Título de la sección
        type: string
      - name: whatsapp
        label: Número de WhatsApp
        type: string
        description: "Formato internacional: 523312843496"
      - name: personas
        label: Personas de contacto
        type: object
        list:
          min: 1
          max: 6
          collapsible:
            summary: "{nombre}"
        fields:
          - name: nombre
            label: Nombre
            type: string
            required: true
          - name: cargo
            label: Cargo
            type: string
          - name: telefono
            label: Teléfono (Texto)
            type: string
          - name: telefonoLink
            label: Teléfono (Enlace)
            type: string
            description: "Solo dígitos: 523312843496"
          - name: email
            label: Email
            type: string